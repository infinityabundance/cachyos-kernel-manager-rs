[package]
name = "cachyos-kernel-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Native Rust custodial reimplementation of CachyOS Kernel Manager (Iced GUI in Phase 8)."
publish = false

[[bin]]
name = "cachyos-kernel-manager"
path = "src/main.rs"

[features]
# Phase 8: the Iced GUI. NOT default — a debug build of the whole
# wgpu/iced stack takes ~30+ minutes, which would stall every `cargo
# test --workspace` and every CI typo. The GUI is verified in a dedicated
# CI job (`--features gui`) and built by the packaging layer
# (`--features gui-alpm` = gui + the real libalpm discovery + the scx
# D-Bus client).
default = []
gui = ["dep:cachyos-kernel-manager-ui", "cachyos-kernel-manager-ui/rendering"]
gui-alpm = ["gui", "cachyos-kernel-manager-ui/alpm", "cachyos-kernel-manager-ui/scx-dbus"]

[dependencies]
cachyos-kernel-manager-core = { workspace = true }
cachyos-kernel-manager-oracle = { workspace = true }
cachyos-kernel-manager-config = { workspace = true }
cachyos-kernel-manager-platform = { workspace = true }
cachyos-kernel-manager-ui = { workspace = true, optional = true }

[workspace]
resolver = "2"
members = [
    "crates/cachyos-kernel-manager-core",
    "crates/cachyos-kernel-manager-alpm",
    "crates/cachyos-kernel-manager-plan",
    "crates/cachyos-kernel-manager-exec",
    "crates/cachyos-kernel-manager-build",
    "crates/cachyos-kernel-manager-config",
    "crates/cachyos-kernel-manager-scx",
    "crates/cachyos-kernel-manager-platform",
    "crates/cachyos-kernel-manager-i18n",
    "crates/cachyos-kernel-manager-ui",
    "crates/cachyos-kernel-manager-casefile",
    "crates/cachyos-kernel-manager-oracle",
    "crates/cachyos-kernel-manager-frf",
    "xtask",
    # Court evidence infrastructure, never shipped. Builds the oracle's
    # config-option-lib struct verbatim with toml 1.1 (the upstream's actual
    # dependency) for the config-roundtrip differential courts.
    "tools/config-oracle-ref",
    # Court evidence infrastructure, never shipped. Reproduces the oracle's
    # get_all_set_values env rendering (conf-window.cpp:421-451 +
    # compile_options.json) for the build-env/env-rendering court.
    "tools/env-oracle-ref",
    # Court evidence infrastructure, never shipped. Reproduces the oracle's
    # variant-switch transitions (conf-window.cpp:553-602) for the
    # option-transitions/variant-switch court.
    "tools/options-oracle-ref",
    # Court evidence infrastructure, never shipped. Reproduces the oracle's
    # build-flow decisions (conf-window.cpp on_execute/finished_proc +
    # aur_kernel.cpp) for the build-env/lifecycle court.
    "tools/buildflow-oracle-ref",
    # Court evidence infrastructure, never shipped. Reproduces the oracle's
    # artifact-glob pipeline (conf-window.cpp:218-298) for the
    # artifact-glob/package-functions court.
    "tools/artifact-oracle-ref",
    # Court evidence infrastructure, never shipped. Reproduces the oracle's
    # AUR support (kernel.cpp:253-283 discovery + 288-304 commit +
    # aur_kernel.cpp:32-55) for the aur/enablement-matrix court.
    "tools/aur-oracle-ref",
    # Court evidence infrastructure, never shipped. Reproduces the oracle's
    # finished_proc (conf-window.cpp:378-405) for the
    # build-env/failure-lifecycle court.
    "tools/finish-oracle-ref",
    # Court evidence infrastructure, never shipped. Reproduces the oracle's
    # Configure-window lifecycle (conf-window.cpp:688-701) for the
    # build-env/cancellation court.
    "tools/cancel-oracle-ref",
    # Court evidence infrastructure, never shipped. Reproduces the oracle's
    # sched-ext surface (pre-extraction scx-manager at f3eeaf6 + scx_loader
    # 1.0.9) for the scx/* courts (Phase 7).
    "tools/scx-oracle-ref",
    # Court evidence infrastructure, never shipped. Re-declares the oracle's
    # user-visible strings for the ui/dialog-strings court (Phase 8).
    "tools/strings-oracle-ref",
    # Court evidence infrastructure, never shipped. Reproduces the oracle's
    # main-window semantics (km-window.cpp) for the ui/main-window-semantics
    # court (Phase 8).
    "tools/mainwindow-oracle-ref",
    # Court evidence infrastructure, never shipped. Reproduces the oracle's
    # Configure-window semantics (conf-window.cpp) for the
    # ui/configure-window-semantics court (Phase 8).
    "tools/confwindow-oracle-ref",
    # Court evidence infrastructure, never shipped. Parses the frozen
    # lang/*.ts translation catalogs directly for the ui/i18n-resolution
    # court (Phase 8).
    "tools/i18n-oracle-ref",
    # Court evidence infrastructure, never shipped. Reproduces the oracle's
    # IsInstanceAlreadyRunning decision (main.cpp:45-56) for the
    # single-instance/stale-lock court (Phase 9).
    "tools/singleinstance-oracle-ref",
]
default-members = [".", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
# MSRV policy: see docs/ARCHITECTURE.md. Value is provisional until CI
# confirms the full dependency graph on the CachyOS toolchain.
rust-version = "1.85"
authors = ["cachyos-kernel-manager-rs contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

cachyos-kernel-manager-core = { path = "crates/cachyos-kernel-manager-core" }
cachyos-kernel-manager-alpm = { path = "crates/cachyos-kernel-manager-alpm" }
cachyos-kernel-manager-plan = { path = "crates/cachyos-kernel-manager-plan" }
cachyos-kernel-manager-exec = { path = "crates/cachyos-kernel-manager-exec" }
cachyos-kernel-manager-build = { path = "crates/cachyos-kernel-manager-build" }
cachyos-kernel-manager-config = { path = "crates/cachyos-kernel-manager-config" }
cachyos-kernel-manager-scx = { path = "crates/cachyos-kernel-manager-scx" }
cachyos-kernel-manager-platform = { path = "crates/cachyos-kernel-manager-platform" }
cachyos-kernel-manager-i18n = { path = "crates/cachyos-kernel-manager-i18n" }
cachyos-kernel-manager-ui = { path = "crates/cachyos-kernel-manager-ui" }
cachyos-kernel-manager-casefile = { path = "crates/cachyos-kernel-manager-casefile" }
cachyos-kernel-manager-oracle = { path = "crates/cachyos-kernel-manager-oracle" }
cachyos-kernel-manager-frf = { path = "crates/cachyos-kernel-manager-frf" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 1
