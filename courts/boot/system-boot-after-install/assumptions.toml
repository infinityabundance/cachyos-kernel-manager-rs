assumptions = [
  "Both runs start from fresh copy-on-write overlays of the SAME baked 'kernel-install' fixture (the base kernel running; the real lts packages CACHED, not installed — offline).",
  "The install command is the courted `pacman -S --needed ...` + --noconfirm (a witness adaptation); the oracle literal == the candidate model render.",
  "The post-install hooks regenerate /boot; the qemu direct-kernel boot uses the base vmlinuz/initramfs, so the reboot boots the base kernel with the new kernel installed alongside.",
  "The REBOOT re-uses the SAME overlay (the install persists); boot-check.sh hard-fails on a missing lts kernel/initramfs.",
  "The execve extraction drops PIDs/env; every written surface must match byte-for-byte between the boots.",
]

[[normalizers]]
name = "boot-surface-extraction"
version = "1.0.0"
source_hash = "vm/in-vm/oracle-boot-install.sh + vm/in-vm/candidate-boot-install.sh + vm/in-vm/boot-check.sh"
input_domain = "the install exec chain, the /boot + kernel states, the hook output, the post-reboot boot status"
transformation = "the surfaces are written as sorted text files per phase (install/reboot); the exec chains drop PIDs/env; boot-check hard-fails on a missing kernel/initramfs"
justification = "the install + reboot surfaces ARE the boot-court contract; determinism across the two boots is the court's second claim"
falsifier = "a byte difference in any surface between the two boots, or a boot-check failure"

[[normalizers]]
name = "pid-grouped-exec-extraction"
version = "1.1.0"
source_hash = "vm/in-vm/*-boot-install.sh + *-remove-boot.sh + *-fail-boot.sh + *-makepkg.sh"
input_domain = "the raw strace -f execve trace of the courted command chain"
transformation = "execve lines are captured WITH their PID, stable-sorted by PID (each process's own sequence preserved in order), then the PID prefix is stripped. The old extraction compared the raw cross-process INTERLEAVING, which is scheduling-dependent: two concurrent mkinitcpio-hook processes (e.g. sed on hook.preset vs cmp on the generated preset) swap order run-to-run on the SAME base image (observed 2026-08-23 on boot/system-boot-after-failure). The per-process exec sequence is the courted surface; the interleaving is environmental noise."
justification = "deterministic comparison of the exec chain despite concurrent children; the manager's own sequential command chain (each exec its own PID group, spawned in order) is preserved"
falsifier = "a per-process exec sequence differing between the two boots"
