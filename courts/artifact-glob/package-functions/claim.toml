  "Per case: the probe output (declare -F + pkgver: lines), byte-for-byte",
  "Per case: the parsed package_ suffixes, in probe order",
  "Per case: the pkgver string (or the broken-pkgbuild error)",
  "Per case: the artifact globs, in suffix order",
  "Per case: the PKGEXT value (incl. the .pkg.tar.zst fallback)",
