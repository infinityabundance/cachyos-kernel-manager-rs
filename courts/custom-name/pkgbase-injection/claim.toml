  "The oracle runs as root under Xvfb with AT-SPI enabled, launched with cwd = /root/.cache/cachyos-km/pkgbuilds so its relative linux-cachyos/* paths resolve (D-004).",
  "The custom name is set through the accessibility tree (editable-text/XTEST); the window default ($pkgbase-custom) is replaced by 'my-kernel'.",
  "No remote patch is added: the patches list is exactly the fixture's own .patch entries from the probe (patches/foo.patch), so the splice carries it through.",
  "The build itself fails fast (makepkg refuses as root); the mutation happens BEFORE the build command and is what this court compares.",
]

observables = [
  "The pre-mutation PKGBUILD (byte-identical on both sides — fixture-integrity)",
  "The post-mutation PKGBUILD, byte-for-byte (pkgbase insertion + splice)",
  "Kernel rows of the SAME run (discovery parity still holds)",
  "Machine residual identity between the two runs (fixture-integrity)",
]

witness = "cargo xtask court run custom-name/pkgbase-injection --vm against fixture 'build-mutation'."

independence = "The oracle is the real upstream binary driven through its real GUI in a disposable VM; the candidate is a separate Rust model mutating the identical fixture text. Neither generates the other's output."

falsifier = "Any byte difference in the mutated PKGBUILD or the pre-mutation text, any discovery row difference, or machine residual drift."

