# CLAIM — custom-name/pkgbase-injection
claim = "Given the 'build-mutation' fixture, driving the real oracle Configure window (set the custom package name to 'my-kernel', add no remote patch, click Build kernel) mutates the checkout PKGBUILD with a '\\n\\npkgbase=\"my-kernel\"' insertion at the last newline before _major= (plus the source=(...) splice with the fixture's own patches/foo.patch list) — and the candidate's insert_custom_pkgbase + insert_patch_source_array models produce byte-identical mutated PKGBUILD text from the same pre-mutation PKGBUILD."

model = "Oracle: real cachyos-kernel-manager v1.19.0 — on_execute (conf-window.cpp:696-735): insert_new_source_array_into_pkgbuild (300-326) then set_custom_name_in_pkgbuild (328-339: find '_major=', insert '\\n\\npkgbase=\"<custom>\"' at the last newline at-or-before it; silent no-op when _major= absent or at file start). Candidate: insert_custom_pkgbase + insert_patch_source_array (build crate)."

assumptions = [
