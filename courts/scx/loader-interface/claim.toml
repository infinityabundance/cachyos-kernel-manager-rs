# CLAIM — scx/loader-interface
claim = "The candidate's typed org.scx.Loader D-Bus client (scx crate, interface descriptor rendered by cachyos-kernel-manager-scx-introspect) is a FAITHFUL SUBSET of the real loader's org.scx.Loader interface, byte-identical in service, path, method names + input signatures, and property names + signatures + access to the frozen authority (scx_loader 1.0.9 src/dbus.rs + src/main.rs, checksum-pinned by the frozen config-option-lib/Cargo.lock) — PROVEN against the reference image's running loader via busctl introspect + the candidate's own D-Bus readback: service org.scx.Loader, path /org/scx/Loader; methods StartScheduler(s,u), StartSchedulerWithArgs(s,as), StopScheduler(), SwitchScheduler(s,u), SwitchSchedulerWithArgs(s,as) (all returning ()); read-only properties CurrentScheduler: s, SchedulerMode: u, SupportedSchedulers: as. The D-Bus NAMES are the PascalCase forms zbus derives from the snake_case Rust names (zbus_macros 5.5.0 utils.rs::pascal_case); the wire signatures follow the zbus/zvariant encodings of the authority's Rust types: SupportedSched (#[zvariant(signature = \"s\")]) -> s; SchedMode (repr-less fieldless enum) -> u (u32); Vec<String> -> as. The readback values match the real loader's (CurrentScheduler, SchedulerMode, SupportedSchedulers). The shipped loader (scx-manager 1.15.12-1 in the reference image) is a later version exposing MORE surface (RestartScheduler/RestoreDefault, CurrentSchedulerArgs/DefaultMode/DefaultScheduler) — the frozen oracle never calls those; the subset relationship is the parity claim."

