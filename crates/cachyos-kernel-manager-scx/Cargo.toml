[package]
name = "cachyos-kernel-manager-scx"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "sched-ext / scx_loader integration: typed org.scx.Loader client + pure decision models (Phase 7)."
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# The typed D-Bus client (zbus/zvariant 5.x — the 5.5.0/5.4.0 pins from
# the frozen authority's lock were raised to the current 5.x because
# Slint's winit backend requires zbus ^5.14; the courted surface is the
# org.scx.Loader wire protocol, which is stable across 5.x).
# Feature-gated: the pure decision models and the interface descriptor are
# always available; the D-Bus transport is needed only by the running
# application and the VM courts.
zbus = { version = "5.19", default-features = false, features = ["tokio"], optional = true }
zvariant = { version = "5.14", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"], optional = true }

[features]
default = []
dbus = ["dep:zbus", "dep:zvariant", "dep:tokio"]

[[bin]]
name = "cachyos-kernel-manager-scx-introspect"
path = "src/bin/introspect.rs"

[[bin]]
name = "cachyos-kernel-manager-scx-model"
path = "src/bin/model.rs"

[[bin]]
name = "cachyos-kernel-manager-scx-state"
path = "src/bin/state.rs"
required-features = ["dbus"]
