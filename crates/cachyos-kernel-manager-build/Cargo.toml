[package]
name = "cachyos-kernel-manager-build"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Build subsystem semantics: PKGBUILD mutation, env probes, artifact globs (pure)."
publish = false

[dependencies]
cachyos-kernel-manager-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "cachyos-kernel-manager-gitcache"
path = "src/bin/git-cache-plan.rs"

[[bin]]
name = "cachyos-kernel-manager-env"
path = "src/bin/env-render.rs"

[[bin]]
name = "cachyos-kernel-manager-variant-switch"
path = "src/bin/variant-switch.rs"

[[bin]]
name = "cachyos-kernel-manager-artifact-glob"
path = "src/bin/artifact-glob.rs"

[[bin]]
name = "cachyos-kernel-manager-mutate"
path = "src/bin/mutate.rs"
