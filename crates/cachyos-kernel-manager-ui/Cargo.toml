[package]
name = "cachyos-kernel-manager-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Iced application (Phase 8). Semantic messages/state + the rendering layer."
publish = false

[dependencies]
cachyos-kernel-manager-core = { workspace = true }
cachyos-kernel-manager-plan = { workspace = true }
cachyos-kernel-manager-build = { workspace = true }
cachyos-kernel-manager-config = { workspace = true }
cachyos-kernel-manager-exec = { workspace = true }
cachyos-kernel-manager-alpm = { workspace = true }
cachyos-kernel-manager-scx = { workspace = true }
cachyos-kernel-manager-platform = { workspace = true }
cachyos-kernel-manager-i18n = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Phase 8: the Slint rendering layer (feature-gated; the semantic models
# and the strings/main-window/configure-window courts do not need it).
# Slint's default desktop backend = winit + the FEMTOVG software renderer:
# no GL/Vulkan requirement, so the GUI runs in VMs with zero GPU setup
# (the wgpu-based iced port needed WGPU_BACKEND=gl + software GL in qemu).
slint = { version = "1.17", optional = true }
# the internal core crate, used to set the runtime ACCENT COLOR (the fluent
# style derives every accent from SlintContext.accent_color via accentify;
# the system-accent XDG path is unavailable in the VM, so without this the
# widgets fall back to the BLUE accent). Version-locked to slint 1.17.1.
i-slint-core = { version = "=1.17.1", optional = true }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"], optional = true }
# the real libalpm backend (the alpm crate's FFI is behind ITS libalpm
# feature; CI cannot build it — the GUI falls back to the empty catalog).
# the real org.scx.Loader D-Bus client (the scx crate's dbus feature).
zbus = { version = "5.19", default-features = false, features = ["tokio"], optional = true }

[build-dependencies]
slint-build = "1.17"

[features]
default = []
rendering = ["dep:slint", "dep:tokio", "dep:i-slint-core"]
# the real libalpm discovery (packaging enables this; CI/dev without system
# libalpm uses the empty-catalog fallback).
alpm = ["cachyos-kernel-manager-alpm/libalpm"]
# the real org.scx.Loader D-Bus client (the scx crate's dbus feature).
scx-dbus = ["cachyos-kernel-manager-scx/dbus", "dep:zbus"]

[[bin]]
name = "cachyos-kernel-manager-strings"
path = "src/bin/strings.rs"

[[bin]]
name = "cachyos-kernel-manager-mainwindow"
path = "src/bin/main-window.rs"

[[bin]]
name = "cachyos-kernel-manager-confwindow"
path = "src/bin/configure-window.rs"

[[bin]]
name = "cachyos-kernel-manager-i18n"
path = "src/bin/i18n.rs"
required-features = ["rendering"]

[[bin]]
name = "cachyos-kernel-manager-gui"
path = "src/bin/gui.rs"
required-features = ["rendering"]

[dev-dependencies]
serde_json = { workspace = true }
# headless rendering for the layout-preview integration test (renders the
# real windows to PNGs with dummy data — no display, no kernel logic).
i-slint-backend-testing = { version = "1.17", features = ["renderer-software"] }
image = "0.25"
