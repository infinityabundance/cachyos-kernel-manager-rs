[package]
name = "cachyos-kernel-manager-alpm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Typed adapter over system libalpm (package state remains ALPM-authoritative)."
publish = false
build = "build.rs"

# The real libalpm FFI lives behind the `libalpm` feature (off by default so
# `cargo test` works without system libalpm). The pure pacman.conf model and
# the null backend compile always.
[features]
default = []
libalpm = []

[dependencies]
cachyos-kernel-manager-core = { workspace = true }
cachyos-kernel-manager-exec = { workspace = true }
cachyos-kernel-manager-plan = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "cachyos-kernel-manager-inspect"
path = "src/bin/inspect.rs"
required-features = ["libalpm"]

[[bin]]
name = "cachyos-kernel-manager-plan"
path = "src/bin/plan.rs"
required-features = ["libalpm"]

[[bin]]
name = "cachyos-kernel-manager-alpm-abi"
path = "src/bin/abi.rs"
required-features = ["libalpm"]
