[package]
name = "cachyos-kernel-manager-alpm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Typed adapter over system libalpm (package state remains ALPM-authoritative)."
publish = false

# The real libalpm FFI binding is Phase 4 and lives behind the `libalpm`
# feature (off by default so `cargo test` works without a system libalpm).
# This crate today defines the adapter trait and a null in-memory backend
# used by tests and pure courts.
[features]
default = []
libalpm = []

[dependencies]
cachyos-kernel-manager-core = { workspace = true }
serde = { workspace = true }
