[package]
name = "scx-oracle-ref"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reference implementation of the oracle's sched-ext surface (pre-extraction scx-manager at f3eeaf6 + scx_loader 1.0.9) for the scx/* differential courts. NOT part of the candidate; evidence infrastructure."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "scx-oracle-ref"
path = "src/main.rs"
