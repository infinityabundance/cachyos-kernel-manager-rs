[package]
name = "singleinstance-oracle-ref"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reference re-declaration of the oracle's IsInstanceAlreadyRunning decision (main.cpp:45-56 + QSharedMemory unix semantics) for the single-instance/stale-lock court. NOT part of the candidate; evidence infrastructure."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "singleinstance-oracle-ref"
path = "src/main.rs"
