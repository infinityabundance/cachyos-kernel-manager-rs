#
# /etc/pacman.conf for the VM base image (and the container that builds it).
#
# Deliberately DIFFERENT from the host's: only generic x86_64 repositories
# ([cachyos], [core], [extra], [multilib]) — the znver4/v3/v4 variants are
# CPU-specific and would make the image non-portable to other build hosts.
#
# NOTE: section ORDER matters. The oracle registers sync databases in
# pacman.conf section order (mINI parse, kernel.cpp discovery), so this file
# is itself part of the court fixtures. The order below mirrors a real
# CachyOS /etc/pacman.conf (cachyos repositories listed BEFORE core/extra;
# the CPU-specific znver4/v3/v4 variants are omitted — they are
# CPU-specific and would make the image non-portable to other build hosts).
#

[options]
# We sign all repos; DatabaseOptional tolerates partially signed mirrors.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
# Parallel downloads speed up image provisioning inside the builder.
ParallelDownloads = 5
# required so $arch/$repo mirror variables resolve
Architecture = auto

# CachyOS repository (generic x86_64). The CachyOS kernel packages
# (linux-cachyos, -headers, -zfs, -nvidia, -nvidia-open) and the oracle's
# runtime deps (chwd, scx-manager) live here.
[cachyos]
Server = https://mirror.cachyos.org/repo/x86_64/cachyos
SigLevel = Required DatabaseOptional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
